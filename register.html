<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dijital Cüzdan — Kayıt</title>
    <link rel="icon" type="image/png" href="applogo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F4F5F7">
    <link rel="apple-touch-icon" href="applogo.png">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="auth-body">
    <div class="auth-card">
        <img src="logo.png" alt="Dijital Cüzdan" class="auth-logo">
        <h1>Hesap oluştur</h1>
        <p class="sub">Birkaç saniyede cüzdanını oluştur</p>
        <form id="registerForm" class="auth-form">
            <div id="authMsg"></div>
            <div class="field">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="kullaniciadi" autocomplete="username" required>
            </div>
            <div class="field">
                <label>Şifre</label>
                <div class="auth-pass">
                    <input type="password" id="password" placeholder="En az 6 karakter" autocomplete="new-password" required minlength="6">
                    <button type="button" class="toggle" data-toggle><span class="material-icons">visibility_off</span></button>
                </div>
            </div>
            <div class="field">
                <label>Şifre Tekrar</label>
                <div class="auth-pass">
                    <input type="password" id="passwordConfirm" placeholder="Şifreyi tekrar gir" autocomplete="new-password" required minlength="6">
                    <button type="button" class="toggle" data-toggle><span class="material-icons">visibility_off</span></button>
                </div>
            </div>
            <div class="field">
                <label>Güvenlik Kodu</label>
                <div class="captcha">
                    <div class="captcha-box" id="captchaBox"></div>
                    <input type="text" id="captchaInput" placeholder="Kodu gir" required>
                    <button type="button" class="captcha-refresh" id="captchaRefresh"><span class="material-icons">refresh</span></button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Kayıt Ol</button>
        </form>
        <p class="auth-alt">Zaten hesabın var mı? <a href="index.html">Giriş yap</a></p>
    </div>
    <script src="auth.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
