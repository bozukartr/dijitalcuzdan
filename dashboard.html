<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Dijital Cüzdan</title>
    <link rel="icon" type="image/png" href="applogo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F4F5F7">
    <link rel="apple-touch-icon" href="applogo.png">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <button class="tb-circle dark" id="menuBtn" aria-label="Menü"><span class="material-icons">menu</span></button>
            <div class="tb-greeting">
                <h1 id="greeting">Merhaba 👋</h1>
                <p id="todayDate">—</p>
            </div>
            <button class="tb-circle light" id="bellBtn" aria-label="Bildirimler"><span class="material-icons">notifications_none</span></button>
        </header>

        <main class="main">
            <!-- ============ ANA SAYFA ============ -->
            <section class="screen active" id="screen-home">
                <div class="balance-card">
                    <svg class="balance-blob" viewBox="0 0 210 200" fill="none">
                        <path d="M150 20c35 5 55 40 50 80s-45 70-90 65-75-40-60-85S100 13 150 20z" fill="var(--green-soft)"/>
                        <path d="M30 130c25-5 30-45 60-45s35 30 70 5" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" fill="none"/>
                        <circle cx="160" cy="92" r="7" fill="var(--ink)"/>
                    </svg>
                    <button class="bc-share" id="shareBtn"><span class="material-icons">ios_share</span></button>
                    <div class="bc-head">
                        <h2>Toplam Bakiye</h2>
                        <button class="bc-eye" id="eyeBtn"><span class="material-icons">visibility</span></button>
                    </div>
                    <div class="bc-value" id="totalBalance">₺0,00</div>
                    <span class="bc-trend" id="trend"><span class="material-icons" style="font-size:18px">arrow_upward</span> %0 bu aya göre</span>
                </div>

                <div class="spend-card">
                    <div class="spend-info">
                        <h3>Aylık Harcama</h3>
                        <div class="spend-amount" id="monthSpend">₺0,00</div>
                        <div class="spend-limit" id="monthLimit">limit ayarla</div>
                    </div>
                    <div class="ring">
                        <svg width="92" height="92" viewBox="0 0 92 92">
                            <circle class="ring-track" cx="46" cy="46" r="40" fill="none" stroke-width="9"/>
                            <circle class="ring-fill" id="ringFill" cx="46" cy="46" r="40" fill="none" stroke-width="9" stroke-dasharray="251.2" stroke-dashoffset="251.2"/>
                        </svg>
                        <div class="ring-label" id="ringLabel">%0</div>
                    </div>
                </div>

                <div class="row-head">
                    <h3>Harcama Dağılımı</h3>
                    <button class="see-all" data-go="analytics">Tümü <span class="material-icons">chevron_right</span></button>
                </div>
                <div class="cat-scroll" id="catScroll"></div>

                <div class="row-head">
                    <h3>Son İşlemler</h3>
                    <button class="see-all" data-go="analytics">Tümü <span class="material-icons">chevron_right</span></button>
                </div>
                <div class="tx-list" id="recentTx"></div>
            </section>

            <!-- ============ ANALİZLER ============ -->
            <section class="screen" id="screen-analytics">
                <div class="month-nav">
                    <button id="anPrev"><span class="material-icons">chevron_left</span></button>
                    <h3 id="anMonth">—</h3>
                    <button id="anNext"><span class="material-icons">chevron_right</span></button>
                </div>
                <div class="analytics-card">
                    <div class="big-num" id="anExpense">₺0,00</div>
                    <div class="sub-num">Bu ay toplam harcama</div>
                    <div class="bars" id="anBars"></div>
                </div>
                <div class="row-head"><h3>İşlemler</h3></div>
                <div class="tx-list" id="allTx"></div>
            </section>

            <!-- ============ HEDEFLER ============ -->
            <section class="screen" id="screen-goals">
                <div class="row-head">
                    <h3>Hedeflerim</h3>
                    <button class="see-all" id="addGoalBtn">Ekle <span class="material-icons">add</span></button>
                </div>
                <div id="goalsList"></div>
            </section>

            <!-- ============ CÜZDAN ============ -->
            <section class="screen" id="screen-wallet">
                <div class="row-head">
                    <h3>Hesaplarım</h3>
                    <button class="see-all" id="addAccountBtn">Ekle <span class="material-icons">add</span></button>
                </div>
                <div id="accountsList"></div>
            </section>
        </main>

        <nav class="tabbar">
            <button class="tab active" data-screen="home"><span class="material-icons">home</span>Ana Sayfa</button>
            <button class="tab" data-screen="analytics"><span class="material-icons">pie_chart</span>Analizler</button>
            <button class="fab" id="fabAdd"><span class="material-icons">add</span></button>
            <button class="tab" data-screen="goals"><span class="material-icons">flag</span>Hedefler</button>
            <button class="tab" data-screen="wallet"><span class="material-icons">account_balance_wallet</span>Cüzdan</button>
        </nav>
    </div>

    <!-- ============ İŞLEM EKLE ============ -->
    <div class="modal" id="txModal">
        <div class="sheet">
            <button class="x-btn" data-close><span class="material-icons">close</span></button>
            <h2>İşlem Ekle</h2>
            <div class="seg" id="txTypeSeg">
                <button type="button" class="active" data-type="expense">Gider</button>
                <button type="button" data-type="income">Gelir</button>
            </div>
            <div class="field amount-field" style="margin-top:14px">
                <label>Tutar</label>
                <input type="text" id="txAmount" inputmode="decimal" placeholder="0,00">
            </div>
            <div class="field" id="txCatField">
                <label>Kategori</label>
                <div class="cat-picker" id="txCatPicker"></div>
            </div>
            <input type="hidden" id="txCategory">
            <div class="field">
                <label>Hesap</label>
                <select id="txAccount"></select>
            </div>
            <div class="field">
                <label>Açıklama (opsiyonel)</label>
                <input type="text" id="txNote" placeholder="Örn. Trendyol siparişi">
            </div>
            <div class="field">
                <label>Tarih</label>
                <input type="date" id="txDate">
            </div>
            <button class="btn btn-primary" id="txSave">Kaydet</button>
        </div>
    </div>

    <!-- ============ HESAP EKLE ============ -->
    <div class="modal" id="accountModal">
        <div class="sheet">
            <button class="x-btn" data-close><span class="material-icons">close</span></button>
            <h2>Hesap Ekle</h2>
            <div class="field">
                <label>Hesap Adı</label>
                <input type="text" id="accName" placeholder="Örn. Maaş Hesabı">
            </div>
            <div class="field">
                <label>Tür</label>
                <div class="seg" id="accTypeSeg">
                    <button type="button" class="active" data-type="Banka">Banka</button>
                    <button type="button" data-type="Kredi Kartı">Kredi Kartı</button>
                    <button type="button" data-type="Nakit">Nakit</button>
                </div>
            </div>
            <div class="field">
                <label>Renk</label>
                <div class="color-row" id="accColors"></div>
            </div>
            <div class="field amount-field">
                <label>Başlangıç Bakiyesi</label>
                <input type="text" id="accBalance" inputmode="decimal" placeholder="0,00">
            </div>
            <button class="btn btn-primary" id="accSave">Kaydet</button>
        </div>
    </div>

    <!-- ============ HESAP DETAY ============ -->
    <div class="modal" id="accDetailModal">
        <div class="sheet">
            <button class="x-btn" data-close><span class="material-icons">close</span></button>
            <h2 id="accDetailName"></h2>
            <div class="big-num" id="accDetailBal"></div>
            <div class="sub-num" id="accDetailType" style="margin-bottom:16px"></div>
            <div class="row-head"><h3>Son işlemler</h3></div>
            <div class="tx-list" id="accDetailTx"></div>
            <button class="btn btn-danger" id="accDelete" style="margin-top:16px">Hesabı Sil</button>
        </div>
    </div>

    <!-- ============ HEDEF EKLE ============ -->
    <div class="modal" id="goalModal">
        <div class="sheet">
            <button class="x-btn" data-close><span class="material-icons">close</span></button>
            <h2>Hedef Ekle</h2>
            <div class="field">
                <label>Hedef Adı</label>
                <input type="text" id="goalName" placeholder="Örn. Tatil">
            </div>
            <div class="field amount-field">
                <label>Hedef Tutar</label>
                <input type="text" id="goalTarget" inputmode="decimal" placeholder="0,00">
            </div>
            <button class="btn btn-primary" id="goalSave">Oluştur</button>
        </div>
    </div>

    <!-- ============ HEDEFE PARA EKLE ============ -->
    <div class="modal" id="goalAddModal">
        <div class="sheet">
            <button class="x-btn" data-close><span class="material-icons">close</span></button>
            <h2 id="goalAddTitle">Para Ekle</h2>
            <div class="field amount-field">
                <label>Eklenecek Tutar</label>
                <input type="text" id="goalAddAmount" inputmode="decimal" placeholder="0,00">
            </div>
            <div class="btn-row">
                <button class="btn btn-danger" id="goalDelete">Hedefi Sil</button>
                <button class="btn btn-primary" id="goalAddSave">Ekle</button>
            </div>
        </div>
    </div>

    <!-- ============ İŞLEM DETAY ============ -->
    <div class="modal" id="txDetailModal">
        <div class="sheet">
            <button class="x-btn" data-close><span class="material-icons">close</span></button>
            <h2 id="txDetailTitle"></h2>
            <div class="big-num" id="txDetailAmount"></div>
            <div class="sub-num" id="txDetailMeta" style="margin-bottom:16px"></div>
            <button class="btn btn-danger" id="txDelete">İşlemi Sil</button>
        </div>
    </div>

    <!-- ============ MENÜ / AYARLAR ============ -->
    <div class="modal" id="menuModal">
        <div class="sheet">
            <button class="x-btn" data-close><span class="material-icons">close</span></button>
            <h2>Ayarlar</h2>
            <div class="field amount-field">
                <label>Aylık Harcama Limiti (0 = kapalı)</label>
                <input type="text" id="limitInput" inputmode="decimal" placeholder="0,00">
            </div>
            <button class="btn btn-primary" id="saveLimit" style="margin-bottom:10px">Limiti Kaydet</button>
            <button class="btn btn-ghost" id="themeBtn" style="margin-bottom:10px">Temayı Değiştir</button>
            <button class="btn btn-danger" id="logoutBtn">Çıkış Yap</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
