<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dijital Cüzdan - Giriş</title>
    <link rel="icon" type="image/png" href="applogo.png">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F1E9DB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dijital Cüzdan">
    <link rel="apple-touch-icon" href="applogo.png">
    <link rel="apple-touch-icon" sizes="192x192" href="applogo.png">
    <link rel="apple-touch-icon" sizes="512x512" href="applogo.png">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <img src="logo.png" alt="Dijital Cüzdan Logo" class="app-logo">
        </div>
        <div class="auth-head">
            <h1 class="auth-title">Tekrar hoş geldiniz</h1>
            <p class="auth-subtitle">Cüzdanınıza erişmek için giriş yapın</p>
        </div>
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <span class="material-icons">person</span>
                <input type="text" id="username" placeholder="Kullanıcı Adı" required>
            </div>
            <div class="pin-field">
                <label class="pin-label">6 Haneli PIN</label>
                <div class="pin-boxes">
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" autocomplete="off" aria-label="PIN 1. hane">
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" autocomplete="off" aria-label="PIN 2. hane">
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" autocomplete="off" aria-label="PIN 3. hane">
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" autocomplete="off" aria-label="PIN 4. hane">
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" autocomplete="off" aria-label="PIN 5. hane">
                    <input type="password" inputmode="numeric" maxlength="1" class="pin-box" autocomplete="off" aria-label="PIN 6. hane">
                </div>
                <input type="hidden" id="password">
            </div>
            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>Beni Hatırla</span>
                </label>
                <a href="#" class="forgot-password">PIN'imi Unuttum</a>
            </div>
            <button type="submit" class="login-btn">
                <span class="material-icons">login</span>
                Giriş Yap
            </button>
            <p class="register-text">
                Hesabınız yok mu? <a href="register.html">Hemen Kaydolun</a>
            </p>
        </form>
    </div>
    <script src="login.js"></script>
    <script src="pin.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
