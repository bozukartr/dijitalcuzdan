<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dijital Cüzdan — Giriş</title>
    <link rel="icon" type="image/png" href="applogo.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F4F5F7">
    <link rel="apple-touch-icon" href="applogo.png">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body class="auth-body">
    <div class="auth-card">
        <img src="logo.png" alt="Dijital Cüzdan" class="auth-logo">
        <h1>Tekrar hoş geldiniz</h1>
        <p class="sub">Cüzdanına erişmek için giriş yap</p>
        <form id="loginForm" class="auth-form">
            <div id="authMsg"></div>
            <div class="field">
                <label>Kullanıcı Adı</label>
                <input type="text" id="username" placeholder="kullaniciadi" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
            </div>
            <div class="field">
                <label>6 Haneli PIN</label>
                <div class="pin" data-target="password" data-autosubmit>
                    <div class="pin-dots">
                        <span class="pin-dot"></span>
                        <span class="pin-dot"></span>
                        <span class="pin-dot"></span>
                        <span class="pin-dot"></span>
                        <span class="pin-dot"></span>
                        <span class="pin-dot"></span>
                    </div>
                    <input class="pin-capture" type="text" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="6 haneli PIN">
                    <input type="hidden" id="password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Giriş Yap</button>
        </form>
        <p class="auth-alt">Hesabın yok mu? <a href="register.html">Kayıt ol</a></p>
    </div>
    <script src="auth.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
